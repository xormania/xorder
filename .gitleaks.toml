title = "xorder secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Generated build_key fields are SHA-256 artifact fingerprints, not credentials"
condition = "AND"
regexTarget = "match"
paths = ['''^catalog\.json$''', '''^release-records/.*\.json$''']
regexes = ['''^build_key"\s*:\s*"[a-f0-9]{64}"$''']

[[rules.allowlists]]
description = "Generated component keys and installed LSP API hashes are SHA-256 artifact identities"
condition = "AND"
regexTarget = "match"
paths = ['''^catalog\.json$''', '''^release-records/[a-z0-9-]+/[a-z0-9.-]+/[0-9]+\.[0-9]+\.[0-9]+\.json$''']
regexes = ['''^(key|installed_lsp_api_sha256)"\s*:\s*"[a-f0-9]{64}"$''']
