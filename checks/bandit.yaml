# xorder intentionally launches tools through the caller's PATH with explicit
# argv. Import/no-shell/PATH notices add no useful signal for those operations.
# Keep shell=True, shell injection and wildcard injection detectors enabled.
skips: [B404, B603, B606, B607]

# Assertions are expected throughout test code, including acceptance fixtures.
# Keep B101 enabled for production scripts, examples and installed image tools.
assert_used:
  skips:
    - tests/*
    - ./tests/*
    - '*/tests/*'
