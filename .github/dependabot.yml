version: 2
updates:
  # Keep fixes prompt; pinned revisions and PR validation provide the adoption gate.
  - package-ecosystem: github-actions # zizmor: ignore[dependabot-cooldown]
    directory: /
    schedule:
      interval: weekly
  # Apply the same prompt-update policy to pinned Python validation tools.
  - package-ecosystem: pip # zizmor: ignore[dependabot-cooldown]
    directory: /
    schedule:
      interval: weekly
