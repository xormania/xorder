name: Match consumer Playwright
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      consumer_ref:
        description: uxor branch or commit containing the proposed Playwright bump
        type: string
        default: main
  repository_dispatch:
    types: [playwright-bump]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: browser-refresh
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.LIBRARY_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.LIBRARY_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements-ci.txt
      - name: Propose the exact consumer pin
        env:
          CONSUMER_REF: ${{ inputs.consumer_ref || github.event.client_payload.consumer_ref || 'main' }}
        run: python3 scripts/refresh_browser.py --consumer-ref "$CONSUMER_REF" --pr
