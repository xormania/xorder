name: Promote accepted aliases
on:
  push:
    branches: [master]
    paths: ['release-records/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-release
  queue: max
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      has_images: ${{ steps.records.outputs.has_images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: records
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess
          from pathlib import PurePosixPath
          base = os.environ.get("BASE_SHA", "")
          if not base or set(base) == {"0"}:
              selected = True
          else:
              changed = subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines()
              selected = any(len(PurePosixPath(path).parts) == 4 and path.startswith("release-records/") and path.endswith(".json") for path in changed)
          print("has_images=" + str(selected).lower())
          PY
  promote:
    permissions:
      contents: read
      packages: write
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: python -m pip install -r requirements-ci.txt
      - run: python scripts/library.py check
      - run: python scripts/release.py --aliases
