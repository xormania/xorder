name: Validate downloadable resources
on:
  workflow_call:
    inputs:
      matrix:
        description: Selected verification targets from the shared planner
        required: true
        type: string
permissions:
  contents: read
jobs:
  resources:
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements-ci.txt
      - name: Exercise downloaded or packaged resource bytes
        run: python -m xorder.verify verify "$RESOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resource-check-${{ strategy.job-index }}
          path: out/resources/
          if-no-files-found: ignore
