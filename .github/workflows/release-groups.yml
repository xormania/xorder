name: Propose scheduled release group
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Ordinary weekly slot, immediate security response, or announced migration'
        type: choice
        options: [scheduled, security, migration]
        default: scheduled
      slot:
        description: 'Exact announced UTC timestamp (Z); required for security/migration, optional for scheduled slot recovery'
        type: string
        required: false
      details:
        description: 'Reason and migration guidance; required for security/migration'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: library-release-group
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.LIBRARY_BOT_TOKEN || github.token }}
      GROUP_REASON: ${{ inputs.reason || 'scheduled' }}
      GROUP_SLOT: ${{ inputs.slot }}
      GROUP_DETAILS: ${{ inputs.details }}
    steps:
      # Trusted automation pushes branches; no checkout or credential artifacts are uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.LIBRARY_BOT_TOKEN || github.token }}
      - run: python -m pip install -r requirements-ci.txt
      - name: Propose or recover the announced cohort
        run: python scripts/group_writeback.py --reason "$GROUP_REASON" --slot "$GROUP_SLOT" --details "$GROUP_DETAILS"
