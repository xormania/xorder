name: Publish verified resources
on:
  schedule:
    # Retry pending publications before Monday's accepted-group proposal.
    - cron: '0 6 * * 0'
  push:
    branches: [master]
    paths: ['images/**', 'artifacts/**', 'scripts/**', 'schemas/**', 'tests/**', 'examples/**', '.dockerignore', '.github/workflows/publish.yml']
  workflow_dispatch:
    inputs:
      publication_reason:
        description: 'Required reason for manual publication, security fix, or candidate recovery'
        type: string
        required: false
        default: ''
      assurance_record:
        description: 'Optional accepted image release-records path: scan/sign that digest without building or changing its record'
        type: string
        required: false
        default: ''
permissions:
  contents: write
  packages: write
  pull-requests: write
concurrency:
  group: library-release
  queue: max
  cancel-in-progress: false
jobs:
  assure-existing:
    needs: prepare
    if: always() && github.ref == 'refs/heads/master' && ((github.event_name == 'workflow_dispatch' && inputs.assurance_record != '') || (github.event_name == 'push' && needs.prepare.result == 'success' && needs.prepare.outputs.assurance_smoke_record != ''))
    permissions:
      contents: write
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      RECORD_PATH: ${{ inputs.assurance_record || needs.prepare.outputs.assurance_smoke_record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - run: python scripts/image_assurance.py install-scanner --directory "$RUNNER_TEMP/xorder-tools"
      - name: Observe and publish assurance for the recorded digest
        run: python scripts/image_assurance.py assure-existing "$RECORD_PATH" --output out/existing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-assurance-existing
          path: out/existing/
          if-no-files-found: ignore
  prepare:
    permissions:
      contents: read
    if: github.ref == 'refs/heads/master' && !inputs.assurance_record
    runs-on: ubuntu-24.04
    outputs:
      assurance_smoke_record: ${{ steps.assurance-smoke.outputs.assurance_smoke_record }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
      browsers: ${{ steps.matrix.outputs.browsers }}
      has_browsers: ${{ steps.matrix.outputs.has_browsers }}
      resources: ${{ steps.resources.outputs.resources }}
      environments: ${{ steps.resources.outputs.environments }}
      has_resources: ${{ steps.resources.outputs.has_resources }}
      has_environments: ${{ steps.resources.outputs.has_environments }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python -m pip install -r requirements-ci.txt
      - id: assurance-smoke
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: python scripts/image_assurance.py smoke-record --base "$BEFORE" >> "$GITHUB_OUTPUT"
      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          PUBLICATION_REASON: ${{ inputs.publication_reason }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            test -n "${PUBLICATION_REASON//[[:space:]]/}" || { echo 'Supply publication_reason for a manual release or recovery.'; exit 1; }
          fi
          matrix=$(python scripts/library.py release-matrix)
          {
            echo "matrix=$matrix"
            echo "has_images=$(python -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["line"])).lower())' "$matrix")"
            python -c 'import json,sys; lines=[line for line in json.loads(sys.argv[1])["line"] if line.startswith("playwright-browser/")]; print("browsers="+json.dumps({"line":lines})); print("has_browsers="+str(bool(lines)).lower())' "$matrix"
          } >> "$GITHUB_OUTPUT"
      - id: resources
        env:
          PYTHONPATH: scripts
        run: |
          matrix=$(python -m xorder.release --matrix)
          python -c 'import json,sys; m=json.loads(sys.argv[1]); print("resources="+json.dumps({"resource":m["resource"]})); print("environments="+json.dumps({"resource":m["environment"]})); print("has_resources="+str(bool(m["resource"])).lower()); print("has_environments="+str(bool(m["environment"])).lower())' "$matrix" >> "$GITHUB_OUTPUT"
  resources:
    permissions:
      contents: write
    needs: prepare
    if: needs.prepare.outputs.has_resources == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.resources) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python -m pip install -r requirements-ci.txt
      - name: Publish and verify public exact resource
        run: python -m xorder.release "$RESOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-resource-${{ strategy.job-index }}
          path: out/resources/**/record.json
          if-no-files-found: ignore
  environments:
    permissions:
      contents: write
    needs: prepare
    if: needs.prepare.outputs.has_environments == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.environments) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: scripts
      RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python -m pip install -r requirements-ci.txt
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile install 'github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv'
      - name: Publish and verify public native environment
        run: python -m xorder.release "$RESOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-environment-${{ strategy.job-index }}
          path: out/resources/**/record.json
          if-no-files-found: ignore
  publish:
    permissions:
      contents: write
      packages: write
      id-token: write
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: cache-key
        env:
          LINE: ${{ matrix.line }}
        run: |
          echo "key=$(python scripts/library.py cache-key "$LINE")" >> "$GITHUB_OUTPUT"
          echo "line=${LINE//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/image-library-build-cache
          key: buildx-v2-${{ runner.os }}-${{ matrix.line }}-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            buildx-v2-${{ runner.os }}-${{ matrix.line }}-
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install checksum-pinned image scanner
        run: python scripts/image_assurance.py install-scanner --directory "$RUNNER_TEMP/xorder-tools"
      - name: Publish or resume exact artifacts
        env:
          LIBRARY_CACHE_DIR: /tmp/image-library-build-cache
          LINE: ${{ matrix.line }}
        run: |
          if [[ "$LINE" == playwright-browser/* ]]; then
            python scripts/browser_release.py stage "$LINE" --output out/browser-candidate.json
          else
            python scripts/release.py "$LINE"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(matrix.line, 'playwright-browser/')
        with:
          name: browser-candidate-${{ steps.cache-key.outputs.line }}
          path: out/browser-candidate.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-${{ strategy.job-index }}
          path: |
            out/**/record.json
            out/**/assurance/**
          if-no-files-found: ignore
  browser-parity:
    # A fresh runner has no publication token, registry login, or checkout credential.
    permissions: {}
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.has_browsers == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.browsers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements-ci.txt
      - id: key
        env:
          LINE: ${{ matrix.line }}
        run: echo "line=${LINE//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-candidate-${{ steps.key.outputs.line }}
          path: out/candidate
      - name: Verify the public digest with controlled consumer infrastructure
        run: python scripts/browser_release.py verify out/candidate/browser-candidate.json --output out/browser-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-verification-${{ steps.key.outputs.line }}
          path: out/
          if-no-files-found: error
  publish-browser:
    permissions:
      contents: write
      packages: write
      id-token: write
    needs: [prepare, browser-parity]
    if: needs.prepare.outputs.has_browsers == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.browsers) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python -m pip install -r requirements-ci.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: key
        env:
          LINE: ${{ matrix.line }}
        run: echo "line=${LINE//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-verification-${{ steps.key.outputs.line }}
          path: out/verified
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install checksum-pinned image scanner
        run: python scripts/image_assurance.py install-scanner --directory "$RUNNER_TEMP/xorder-tools"
      - name: Finalize only the exact anonymously verified digest
        env:
          LINE: ${{ matrix.line }}
        run: python scripts/release.py "$LINE" --browser-evidence out/verified/browser-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-browser-${{ strategy.job-index }}
          path: |
            out/**/record.json
            out/**/assurance/**
          if-no-files-found: ignore
  documentation:
    permissions:
      contents: write
      pull-requests: write
    if: always() && needs.prepare.result == 'success' && (needs.prepare.outputs.has_images == 'true' || needs.prepare.outputs.has_resources == 'true' || needs.prepare.outputs.has_environments == 'true')
    needs: [prepare, publish, publish-browser, resources, environments]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.LIBRARY_BOT_TOKEN || github.token }}
    steps:
      # Trusted automation pushes branches; no checkout or credential artifacts are uploaded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.LIBRARY_BOT_TOKEN || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: out/releases
          merge-multiple: true
      - name: Stage verified records and generate catalog
        run: |
          python -m pip install -r requirements-ci.txt
          python scripts/writeback.py
