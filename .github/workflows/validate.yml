name: Validate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 2'
permissions:
  contents: read
  actions: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  # Metadata edits wait for current behavior checks, then reuse their success.
  # A new source revision or target branch still supersedes obsolete work.
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
jobs:
  fast-checks:
    # Workflow-local ./ references resolve this commit; actionlint lacks $/ support.
    uses: ./.github/workflows/fast-checks.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
  attribution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject AI attribution metadata
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/check_attribution.py \
            --audit \
            --head "$HEAD_SHA" \
            --event-path "$GITHUB_EVENT_PATH"
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_images: ${{ steps.matrix.outputs.has_images }}
      resources: ${{ steps.resources.outputs.resources }}
      environments: ${{ steps.resources.outputs.environments }}
      has_resources: ${{ steps.resources.outputs.has_resources }}
      has_environments: ${{ steps.resources.outputs.has_environments }}
      has_application: ${{ steps.application.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - id: validation-base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validation_base.py --github-output --record-context out/validation-context.json >> "$GITHUB_OUTPUT"
      - name: Validate catalog and immutable support policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/library.py check --previous-policy-ref "$BASE_SHA"
          else
            python scripts/library.py check
          fi
      - name: Unit tests
        if: steps.validation-base.outputs.same_head != 'true'
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        if: steps.validation-base.outputs.same_head != 'true'
        run: python -m compileall -q scripts tests
      - name: Shell syntax
        if: steps.validation-base.outputs.same_head != 'true'
        run: find scripts images tests examples -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - id: matrix
        env:
          BASE_SHA: ${{ steps.validation-base.outputs.sha }}
          COMPARE_HEAD: ${{ steps.validation-base.outputs.head }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            matrix=$(python scripts/library.py validation-matrix --base "$BASE_SHA" --head "$COMPARE_HEAD")
          else
            matrix=$(python scripts/library.py validation-matrix --all)
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_images=$(python -c 'import json,sys; print(str(bool(json.loads(sys.argv[1])["include"])).lower())' "$matrix")" >> "$GITHUB_OUTPUT"
          python -c 'import json,sys; m=json.loads(sys.argv[1]); print("\n### Requested image checks\n"); print("\n".join("- " + row["line"] + ": " + ", ".join(line + " [" + ", ".join(row["verify_suites"][line]) + "]" for line in row["verify_lines"]) for row in m["include"]) or "No image runtime checks required."); print("\nFreshly built targets run their full suite; build evidence records actual checks.")' "$matrix" >> "$GITHUB_STEP_SUMMARY"
      - id: resources
        env:
          BASE_SHA: ${{ steps.validation-base.outputs.sha }}
          COMPARE_HEAD: ${{ steps.validation-base.outputs.head }}
          PYTHONPATH: scripts
        run: |
          if [ -n "$BASE_SHA" ]; then
            matrix=$(python -m xorder.verify matrix --base "$BASE_SHA" --head "$COMPARE_HEAD")
          else
            matrix=$(python -m xorder.verify matrix --all)
          fi
          python -c 'import json,sys; m=json.loads(sys.argv[1]); print("resources="+json.dumps({"resource":m["resource"]})); print("environments="+json.dumps({"resource":m["environment"]})); print("has_resources="+str(bool(m["resource"])).lower()); print("has_environments="+str(bool(m["environment"])).lower())' "$matrix" >> "$GITHUB_OUTPUT"
      - id: application
        env:
          BASE_SHA: ${{ steps.validation-base.outputs.sha }}
          COMPARE_HEAD: ${{ steps.validation-base.outputs.head }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, subprocess
          base = os.environ.get("BASE_SHA", "")
          head = os.environ.get("COMPARE_HEAD", "HEAD")
          changed = subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines() if base else None
          prefixes = ("scripts/xorder/", "artifacts/configuration/", "artifacts/context/", "profiles/", "schemas/resource", "schemas/catalog-v2", "schemas/profile", "schemas/resolution-lock", "schemas/installation-receipt", "tests/fixtures/artifacts/application/")
          exact = {"scripts/xorder_cli.py", "tests/requirements/resource-application.json", ".github/workflows/validate.yml"}
          enabled = changed is None or any(path in exact or path.startswith(prefixes) for path in changed)
          print("enabled=" + str(enabled).lower())
          PY
      - name: Retain the tested source and target context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-context-${{ github.run_attempt }}
          path: out/validation-context.json
          retention-days: 14
          if-no-files-found: error
  application:
    needs: metadata
    if: needs.metadata.outputs.has_application == 'true'
    strategy:
      fail-fast: false
      matrix:
        surface: [host, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Exercise cold application on the host
        if: matrix.surface == 'host'
        run: |
          python -m pip install -r requirements-ci.txt
          python tests/fixtures/artifacts/application/check.py --output out/application-host.json
      - name: Exercise cold application in a disposable verified image
        if: matrix.surface == 'container'
        run: |
          image=$(python - <<'PY'
          import json
          entries = [item for item in json.load(open("catalog-v2.json"))["resources"] if item["id"] == "image/python-dev/3.14-trixie" and item["lifecycle"] == "available" and item["verification"]["status"] == "passed" and "linux/amd64" in item["targets"]]
          if not entries:
              raise SystemExit("No accepted Python image for the application consumer")
          print(max(entries, key=lambda item: tuple(map(int, item["version"].split("."))))["identity"])
          PY
          )
          docker pull "$image"
          mkdir -p out
          printf '%s\n' "$image" > out/application-container-image.txt
          docker run --rm --platform linux/amd64 \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -v "$PWD:/workspace/source:ro" -v "$PWD/out:/out" \
            -w /workspace/source "$image" bash -euc '
              python -m venv /tmp/xorder-validation
              /tmp/xorder-validation/bin/python -m pip install -r requirements-ci.txt
              /tmp/xorder-validation/bin/python tests/fixtures/artifacts/application/check.py --output /out/application-container.json
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: application-${{ matrix.surface }}
          path: out/application-*
          if-no-files-found: ignore
  resources:
    needs: metadata
    if: needs.metadata.outputs.has_resources == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.resources) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements-ci.txt
      - name: Exercise downloaded or packaged resource bytes
        run: python -m xorder.verify verify "$RESOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resource-check-${{ strategy.job-index }}
          path: out/resources/
          if-no-files-found: ignore
  environments:
    needs: metadata
    if: needs.metadata.outputs.has_environments == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.environments) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: scripts
      RESOURCE: ${{ matrix.resource }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install -r requirements-ci.txt
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Install pinned devenv
        run: nix profile install 'github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222#devenv'
      - name: Exercise the packaged native environment
        run: python -m xorder.verify verify "$RESOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: environment-check-${{ strategy.job-index }}
          path: out/resources/
          if-no-files-found: ignore
  images:
    needs: metadata
    if: needs.metadata.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enable local parent images and cache export
        if: startsWith(matrix.line, 'php-') || startsWith(matrix.line, 'python-')
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ (startsWith(matrix.line, 'php-') || startsWith(matrix.line, 'python-')) && 'docker' || 'docker-container' }}
      - id: cache-key
        env:
          LINE: ${{ matrix.line }}
        run: echo "key=$(python scripts/library.py cache-key "$LINE")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/image-library-build-cache
          key: buildx-v2-${{ runner.os }}-${{ matrix.line }}-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            buildx-v2-${{ runner.os }}-${{ matrix.line }}-
      - name: Build and exercise the documented recipe
        env:
          LIBRARY_CACHE_DIR: /tmp/image-library-build-cache
          LINE: ${{ matrix.line }}
          SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_LINES: ${{ toJSON(matrix.verify_lines) }}
          VERIFY_SUITES: ${{ toJSON(matrix.verify_suites) }}
        run: |
          mkdir -p out
          python scripts/build.py "$LINE" image-library-check:dev --source "$SOURCE" --cache "${LINE//\//-}" --inventory out/dev.json --children --reuse-accepted --verify-lines "$VERIFY_LINES" --verify-suites "$VERIFY_SUITES"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inventory-${{ strategy.job-index }}
          path: out/
          if-no-files-found: ignore
  checks:
    if: always()
    needs: [fast-checks, attribution, metadata, images, resources, environments, application]
    runs-on: ubuntu-24.04
    steps:
      - env:
          ATTRIBUTION: ${{ needs.attribution.result }}
          FAST_CHECKS: ${{ needs.fast-checks.result }}
          METADATA: ${{ needs.metadata.result }}
          IMAGES: ${{ needs.images.result }}
          RESOURCES: ${{ needs.resources.result }}
          ENVIRONMENTS: ${{ needs.environments.result }}
          APPLICATION: ${{ needs.application.result }}
        run: |
          test "$ATTRIBUTION" = success
          test "$FAST_CHECKS" = success
          test "$METADATA" = success
          [[ "$IMAGES" == success || "$IMAGES" == skipped ]]
          [[ "$RESOURCES" == success || "$RESOURCES" == skipped ]]
          [[ "$ENVIRONMENTS" == success || "$ENVIRONMENTS" == skipped ]]
          [[ "$APPLICATION" == success || "$APPLICATION" == skipped ]]
