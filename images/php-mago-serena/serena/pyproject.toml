[project]
name = "mago-serena-poc"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "serena-agent",
  "serena-mago-adapter",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["adapter"]

[tool.uv.sources]
# The dependency component checks out the reviewed commit and applies security.patch.
serena-agent = { path = "upstream" }
serena-mago-adapter = { workspace = true }
