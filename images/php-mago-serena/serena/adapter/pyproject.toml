[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "serena-mago-adapter"
version = "0.1.0"
description = "External SolidLSP backend for the pinned experimental Mago server"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["serena-agent"]

[project.entry-points."solidlsp.language_server_registration"]
mago = "serena_mago:register"

[tool.hatch.build.targets.wheel]
packages = ["src/serena_mago"]
