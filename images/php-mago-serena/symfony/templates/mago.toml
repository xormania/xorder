# One effective root configuration is shared by CLI analysis and the Mago LSP.
# Native checks disable extension hosts with --no-extensions.
php-version = "__PHP_VERSION__"
threads = 4

[source]
paths = ["src", "tests"]
includes = ["vendor"]
excludes = ["var"]

[linter]
integrations = ["symfony", "phpunit"]

[formatter]
print-width = 120

[language-server]
restart-on = [".mago/container-reference.dev.json", ".mago/extensions.php"]

[extension-hosts.php]
working-directory = "."
workers = 1
command = ["env", "MAGO_EXTENSION_BACKEND=php", "MAGO_SYMFONY_WIRING_ATTESTATION=1", "php", "-d", "display_errors=stderr", "-d", "memory_limit=1G", ".mago/extensions.php"]
